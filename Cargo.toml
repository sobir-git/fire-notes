[package]
name = "fire-notes"
version = "0.1.0"
edition = "2021"

[dependencies]
fire-ui = { path = "../fire-ui/crates/fire-ui" }
fire-ui-widgets = { path = "../fire-ui/crates/fire-ui-widgets" }
fire-ui-native = { path = "../fire-ui/crates/fire-ui-native", features = ["accessibility", "inspection", "clipboard", "dialogs", "bitmap-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
