[package]
name = "fire-notes"
version = "0.1.0"
edition = "2021"

[dependencies]
fire-ui-fonts = { version = "=0.6.0", path = "../fire-ui/crates/fire-ui-fonts", features = ["mmap"] }
fire-ui = { version = "=0.6.0", path = "../fire-ui/crates/fire-ui" }
fire-ui-widgets = { version = "=0.6.0", path = "../fire-ui/crates/fire-ui-widgets" }
fire-ui-native = { version = "=0.6.0", path = "../fire-ui/crates/fire-ui-native", features = ["accessibility", "inspection", "clipboard", "dialogs"] }
fire-ui-text = { version = "=0.6.0", path = "../fire-ui/crates/fire-ui-text" }
fire-ui-cairo = { version = "=0.6.0", path = "../fire-ui/crates/fire-ui-cairo", features = ["x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
